<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AA6A" />
      <stop offset="100%" stop-color="#A8863A" />
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="256" cy="256" r="248" fill="#0f0f0f" />

  <!-- stitched dashed ring -->
  <circle
    cx="256" cy="256" r="220"
    fill="none"
    stroke="url(#gold)"
    stroke-width="7"
    stroke-dasharray="20 14"
  />

  <!-- inner solid ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#D4AA6A" stroke-width="2.5" opacity="0.5" />

  <!-- AP monogram -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="200"
    font-weight="700"
    fill="url(#gold)"
  >AP</text>
</svg>
